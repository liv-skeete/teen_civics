<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111; max-width: 560px; margin: 0 auto; padding: 24px;">
    <h1 style="color: #1A237E; margin-bottom: 8px;">Welcome to TeenCivics!</h1>
    <p>Thanks for signing up. Confirm your email to start earning Kudos and climbing the ranks.</p>

    <p style="margin: 28px 0;">
      <a href="{{ verify_url }}"
         style="background:#1A237E;color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:600;display:inline-block;">
        Verify email
      </a>
    </p>

    <p style="color:#555;font-size:14px;">Or paste this link into your browser:</p>
    <p style="word-break:break-all;font-size:13px;color:#1A237E;">{{ verify_url }}</p>

    <hr style="border:none;border-top:1px solid #eee;margin:32px 0;">
    <p style="color:#888;font-size:12px;">This link expires in 24 hours. If you didn't sign up, you can ignore this email.</p>
  </body>
</html>
